  <text class="serif ink" x="400" y="42" font-size="27" font-weight="700" text-anchor="middle"><tspan class="brass">figurehead</tspan> draws the reader's day.</text>
  <text class="serif muted" x="400" y="68" font-size="16" font-style="italic" text-anchor="middle">one concept, one shape, one spec, checked before it ships</text>
