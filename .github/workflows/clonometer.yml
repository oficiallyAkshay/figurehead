# GitHub keeps clone traffic for fourteen days. clonometer reads it daily and
# keeps a lifetime ledger on the badges branch, which the README badge reads.
# GitHub disables a scheduled workflow on a public repository after 60 days
# with no commit; any commit on any branch resets that clock.
name: clonometer
on:
  schedule: [{cron: "23 3 * * *"}]
  workflow_dispatch:
permissions: {}
concurrency: {group: clonometer}
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Everything the job does runs through its own TRAFFIC_TOKEN; the
    # built-in GITHUB_TOKEN is never used, so the job needs none of it.
    permissions: {}
    steps:
      - uses: oficiallyAkshay/clonometer@208c2cc913d1d1ea7f76f4f9cce759073cd744f5 # v1.0.1
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          metrics: clones,views
