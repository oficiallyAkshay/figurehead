name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A second push to a pull request supersedes the first, so cancel the run it
# replaced. Pushes to main key on the commit instead, so a rapid second push
# gets its own group rather than dropping the first push's run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything that reads the tree without running the suite: hooks and
  # secrets over the whole history, and a syntax pass over every script.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks reads pull request metadata to report what it finds.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history, not the working tree.
          fetch-depth: 0
          persist-credentials: false
      # The same hooks contributors run locally, so CI and the pre-commit
      # config cannot drift: gitleaks, actionlint and zizmor. gitleaks's own
      # pre-commit hook only sees the working tree; the secrets scan step
      # below covers the full history a hook cannot see. pipx ships
      # preinstalled on the runner image, so this needs no extra setup step
      # for a repo with no other Python use.
      - name: pre-commit hooks
        run: pipx run pre-commit run --all-files --show-diff-on-failure
      # pinact has no pre-commit hook of its own to pin to, so it runs as its
      # own step: every `uses:` must be a full commit SHA, and that SHA must
      # actually be the commit the trailing version comment names, never a
      # hand-edited or stale one. fix: "false" only checks; it never rewrites
      # a workflow file or pushes a commit.
      - name: verify actions are pinned
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          verify: "true"
      - name: secrets scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: every script parses
        run: for f in scripts/*.mjs; do node --check "$f"; done

  # The declared floor and the newest release. There is nothing to install:
  # the skill has no dependencies, so there is no npm ci and no lockfile.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # The goldens live inside the suite: every example is rendered from its
      # spec and compared byte for byte, so drift fails here.
      - run: npm test

  # The one context the branch ruleset requires.
  ci:
    needs: [checks, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "a required job did not succeed" >&2
              exit 1
            fi
          done
